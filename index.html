<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СЕМКА: ФАТАЛИТИ ОГУРЦА</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  body {
    font-family: 'Courier New', Courier, monospace;
    background: #111;
    color: #fff;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }

  #game-container {
    position: relative;
    width: 800px;
    height: 450px;
    background: linear-gradient(to bottom, #4b134f, #c94b4b);
    border: 4px solid #333;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(255,0,0,0.5);
  }

  /* Земля */
  .ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 50px;
    background: #2c3e50;
    border-top: 4px solid #1a252f;
  }

  /* ================= ИГРОКИ ================= */
  .fighter {
    position: absolute;
    bottom: 50px;
    width: 80px;
    height: 120px;
    z-index: 10;
    transition: transform 0.1s;
  }

  .body {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .fighter img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    border: 2px solid #fff;
  }

  .fighter .placeholder {
    width: 100%;
    height: 100%;
    background: #ff6b6b;
    border-radius: 10px;
    border: 2px solid #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2em;
    font-weight: bold;
  }

  #semka { left: 100px; }
  #cucumber-boss { right: 100px; width: 100px; height: 140px; }

  /* ================= РУКИ С ПЕРЧАТКАМИ ================= */
  .arm {
    position: absolute;
    font-size: 35px;
    line-height: 1;
    z-index: 15;
    transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5));
  }

  /* === СМЕЩЕННЫЕ РУКИ СЕМКИ === */
  #semka-arm-front { right: -45px; top: 45px; } /* Сдвинули правее (было -25px) */
  #semka-arm-back { right: -5px; top: 30px; z-index: 5; transform: scale(0.8); filter: brightness(0.7); } /* Сдвинули правее (было 15px) */

  /* === СМЕЩЕННЫЕ РУКИ ОГУРЦА === */
  #boss-arm-front { left: -45px; top: 45px; transform: scaleX(-1); } /* Сдвинули левее */
  #boss-arm-back { left: -5px; top: 30px; z-index: 5; transform: scale(-0.8, 0.8); filter: brightness(0.7); } /* Сдвинули левее */

  /* Анимация удара рукой */
  .punch-front #semka-arm-front {
    transform: translateX(70px) scale(1.3) rotate(15deg);
  }
  .punch-front #boss-arm-front {
    transform: translateX(-70px) scaleX(-1) scale(1.3) rotate(15deg);
  }

  /* Анимация замаха (Задняя рука) */
  .punch-back #semka-arm-back {
    transform: translateX(20px) scale(0.9) rotate(-20deg);
    filter: brightness(1);
  }
  .punch-back #boss-arm-back {
    transform: translateX(-20px) scale(-0.9, 0.9) rotate(20deg);
    filter: brightness(1);
  }

  /* Анимация пинка */
  .kick #semka {
    transform: translateX(30px) rotate(-15deg) !important;
  }

  .hurt { animation: hurt 0.2s; }
  .jumping { animation: jump 0.5s ease-out; }

  @keyframes hurt {
    0% { transform: translateX(0); opacity: 1; }
    25% { transform: translateX(-15px); opacity: 0.5; }
    50% { transform: translateX(15px); opacity: 1; }
    100% { transform: translateX(0); }
  }
  @keyframes jump {
    0% { bottom: 50px; }
    50% { bottom: 200px; }
    100% { bottom: 50px; }
  }

  /* ================= ПОЛОСКИ ЗДОРОВЬЯ ================= */
  .health-bar-container {
    position: absolute;
    top: 20px;
    width: 300px;
    height: 30px;
    background: #333;
    border: 3px solid #fff;
    border-radius: 5px;
    overflow: hidden;
  }
  #semka-health { left: 20px; }
  #boss-health { right: 20px; }
  
  .health-fill {
    height: 100%;
    width: 100%;
    transition: width 0.3s;
  }
  #semka-health .health-fill { background: #00ff00; }
  #boss-health .health-fill { background: #ff0000; float: right; }

  .names {
    position: absolute;
    top: 55px;
    font-size: 1.2em;
    font-weight: bold;
    text-shadow: 2px 2px 0 #000;
  }
  #semka-name { left: 20px; color: #00ff00; }
  #boss-name { right: 20px; color: #ff0000; }

  /* Летящий огурец и эффекты */
  .projectile {
    position: absolute;
    font-size: 40px;
    z-index: 20;
    filter: drop-shadow(0 0 10px #ffeb3b);
  }

  .hit-effect {
    position: absolute;
    font-size: 3em;
    z-index: 30;
    pointer-events: none;
    animation: pop 0.3s ease-out forwards;
  }
  @keyframes pop {
    0% { transform: scale(0); opacity: 1; }
    100% { transform: scale(2); opacity: 0; }
  }

  /* Меню */
  .overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .overlay h2 {
    font-size: 3em;
    color: #ff3333;
    text-shadow: 4px 4px 0 #000;
    margin-bottom: 20px;
    text-align: center;
  }
  .overlay p {
    font-size: 1.2em;
    margin-bottom: 10px;
    text-align: center;
  }
  .overlay button {
    padding: 15px 40px;
    font-size: 1.5em;
    font-weight: bold;
    font-family: inherit;
    background: #ff3333;
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 20px;
    box-shadow: 0 5px 0 #990000;
  }
  .overlay button:active { transform: translateY(5px); box-shadow: none; }
  .hidden { display: none !important; }

  .controls-info {
    margin-top: 15px; display: flex; gap: 20px; font-size: 1em; color: #ccc;
  }
  .controls-info span {
    background: #222; padding: 5px 10px; border-radius: 5px; border: 1px solid #444;
  }
</style>
</head>
<body>

<h1 style="color: #ff3333; text-shadow: 3px 3px 0 #000; margin-bottom: 10px;">СЕМКА: ФАТАЛИТИ ОГУРЦА</h1>

<div id="game-container">
  <div class="ground"></div>

  <!-- ХП Семки -->
  <div class="health-bar-container" id="semka-health">
    <div class="health-fill" id="semka-health-fill"></div>
  </div>
  <div class="names" id="semka-name">СЕМКА</div>

  <!-- ХП Босса -->
  <div class="health-bar-container" id="boss-health">
    <div class="health-fill" id="boss-health-fill"></div>
  </div>
  <div class="names" id="boss-name">ГИГА-ОГУРЕЦ</div>

  <!-- Игроки -->
  <div class="fighter" id="semka">
    <div class="body">
      <!-- ======================================================== -->
      <!-- МЕСТО ДЛЯ ФОТО СЕМКИ: ЗАМЕНИ semka1.jpg НА СВОЮ КАРТИНКУ -->
      <!-- ======================================================== -->
      <img src="semka1.jpg" alt="Семка" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <!-- ======================================================== -->
      
      <div class="placeholder" style="display:none;">СЕМКА</div>
    </div>
    <!-- Руки Семки -->
    <div class="arm" id="semka-arm-back">🥊</div>
    <div class="arm" id="semka-arm-front">🥊</div>
  </div>

  <div class="fighter" id="cucumber-boss">
    <div class="body">
      <div class="placeholder" style="background:#2ecc71; font-size:3em; border-radius:50%;">🥒</div>
    </div>
    <!-- Руки Огурца -->
    <div class="arm" id="boss-arm-back">🥊</div>
    <div class="arm" id="boss-arm-front">🥊</div>
  </div>

  <!-- Меню -->
  <div class="overlay" id="start-screen">
    <h2>СЕМКА vs ГИГА-ОГУРЕЦ</h2>
    <p><b>W, A, S, D</b> — Движение и Прыжок (W)</p>
    <p><b>E</b> — Удар рукой, <b>Q</b> — Пинок, <b>R</b> — Огурец</p>
    <button onclick="startGame()">В БОЙ!</button>
  </div>

  <div class="overlay hidden" id="game-over">
    <h2 id="result-text">СЕМКА УНИЧТОЖЕН</h2>
    <p id="result-sub">Огурец победил. Как всегда.</p>
    <button onclick="location.reload()">РЕВАНШ</button>
  </div>
</div>

<div class="controls-info">
  <span>WASD : Движение + Прыжок</span>
  <span>E : Удар</span>
  <span>Q : Пинок</span>
  <span>R : Огурец</span>
</div>

<script>
  // ==== НАСТРОЙКИ ====
  const GAME_WIDTH = 800;
  const GROUND_LEVEL = 50;
  
  let isGameRunning = false;
  let animationId;

  // Семка
  const semka = {
    el: document.getElementById('semka'),
    x: 100,
    y: GROUND_LEVEL,
    hp: 100,
    maxHp: 100,
    speed: 6,
    isJumping: false,
    isAttacking: false,
    lastAttackTime: 0,
    facingRight: true
  };

  // Босс (Огурец)
  const boss = {
    el: document.getElementById('cucumber-boss'),
    x: 580,
    y: GROUND_LEVEL,
    hp: 100,
    maxHp: 100,
    speed: 1.5,
    isAttacking: false,
    attackCooldown: 0
  };

  const keys = {};

  // ==== ИНИЦИАЛИЗАЦИЯ ====
  function startGame() {
    document.getElementById('start-screen').classList.add('hidden');
    isGameRunning = true;
    updatePositions();
    gameLoop();
  }

  // ==== УПРАВЛЕНИЕ ====
  window.addEventListener('keydown', (e) => {
    if (!isGameRunning) return;
    keys[e.code] = true;

    // Прыжок на W
    if (e.code === 'KeyW' && !semka.isJumping) jump();
    // Удар рукой на E
    if (e.code === 'KeyE') attack('punch');
    // Пинок на Q
    if (e.code === 'KeyQ') attack('kick');
    // Огурец на R
    if (e.code === 'KeyR') attack('special');
  });

  window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
  });

  // ==== ДЕЙСТВИЯ СЕМКИ ====
  function jump() {
    semka.isJumping = true;
    semka.el.classList.add('jumping');
    setTimeout(() => {
      semka.isJumping = false;
      semka.el.classList.remove('jumping');
    }, 500);
  }

  function attack(type) {
    if (semka.isAttacking) return;
    semka.isAttacking = true;

    const now = Date.now();
    if (now - semka.lastAttackTime < 300) {
      semka.isAttacking = false;
      return;
    }
    semka.lastAttackTime = now;

    let damage = 0;

    if (type === 'punch') {
      damage = 5;
      semka.el.classList.add('punch-front');
      setTimeout(() => semka.el.classList.add('punch-back'), 50);
    } else if (type === 'kick') {
      damage = 10;
      semka.el.classList.add('kick');
    } else if (type === 'special') {
      damage = 15;
      throwCucumber();
    }

    // Проверка попадания
    const distance = Math.abs(semka.x - boss.x);
    if (distance < 160 && type !== 'special') {
      boss.hp -= damage;
      showHitEffect(boss.x, boss.y + 50, '💥');
      boss.el.classList.add('hurt');
      setTimeout(() => boss.el.classList.remove('hurt'), 200);
      updateHealthBars();
    }

    // Сброс анимации
    setTimeout(() => {
      semka.el.classList.remove('punch-front', 'punch-back', 'kick');
      semka.isAttacking = false;
    }, 250);
  }

  function throwCucumber() {
    const projectile = document.createElement('div');
    projectile.className = 'projectile';
    projectile.textContent = '🥒';
    
    // Позиция и направление зависят от того, куда смотрит Семка
    const startX = semka.facingRight ? semka.x + 60 : semka.x - 20;
    projectile.style.left = startX + 'px';
    projectile.style.bottom = (GROUND_LEVEL + 60) + 'px';
    document.getElementById('game-container').appendChild(projectile);

    let currentX = startX;
    const targetX = boss.x;
    const direction = semka.facingRight ? 1 : -1;

    const flyInterval = setInterval(() => {
      currentX += 15 * direction;
      projectile.style.left = currentX + 'px';

      // Проверка попадания или вылета за экран
      const hit = semka.facingRight ? currentX >= targetX : currentX <= targetX;
      
      if (hit || currentX < -50 || currentX > GAME_WIDTH + 50) {
        clearInterval(flyInterval);
        projectile.remove();
        
        if (hit && !boss.isAttacking) {
          boss.hp -= 15;
          showHitEffect(boss.x, boss.y + 50, '💥');
          boss.el.classList.add('hurt');
          setTimeout(() => boss.el.classList.remove('hurt'), 200);
          updateHealthBars();
        }
      }
    }, 20);
  }

  // ==== ДЕЙСТВИЯ БОССА (ИИ) ====
  function bossAI() {
    if (!isGameRunning || boss.hp <= 0) return;

    const distance = Math.abs(semka.x - boss.x);

    if (distance < 140 && boss.attackCooldown <= 0) {
      bossAttack();
    } else if (distance >= 140) {
      // Босс всегда идет к Семке
      if (boss.x > semka.x) boss.x -= boss.speed;
      else boss.x += boss.speed;
      updatePositions();
    }

    if (boss.attackCooldown > 0) boss.attackCooldown -= 16;
  }

  function bossAttack() {
    boss.isAttacking = true;
    boss.attackCooldown = 1500;
    
    boss.el.classList.add('punch-front');
    setTimeout(() => boss.el.classList.add('punch-back'), 50);

    setTimeout(() => {
      boss.el.classList.remove('punch-front', 'punch-back');
      
      if (Math.abs(semka.x - boss.x) < 160) {
        semka.hp -= 10;
        showHitEffect(semka.x, semka.y + 50, '💥');
        semka.el.classList.add('hurt');
        setTimeout(() => semka.el.classList.remove('hurt'), 200);
        updateHealthBars();
      }
      boss.isAttacking = false;
    }, 300);
  }

  // ==== ОБНОВЛЕНИЕ ЭКРАНА ====
  function gameLoop() {
    if (!isGameRunning) return;

    // Управление WASD
    if (!semka.isAttacking) {
      if (keys['KeyA']) {
        semka.x -= semka.speed;
        if (semka.facingRight) {
          semka.facingRight = false;
          semka.el.style.transform = `scaleX(-1)`;
        }
      } else if (keys['KeyD']) {
        semka.x += semka.speed;
        if (!semka.facingRight) {
          semka.facingRight = true;
          semka.el.style.transform = `scaleX(1)`;
        }
      }
    }

    if (semka.x < 20) semka.x = 20;
    if (semka.x > GAME_WIDTH - 100) semka.x = GAME_WIDTH - 100;
    if (boss.x < 20) boss.x = 20;
    if (boss.x > GAME_WIDTH - 120) boss.x = GAME_WIDTH - 120;

    updatePositions();
    bossAI();
    checkWinLose();

    animationId = requestAnimationFrame(gameLoop);
  }

  function updatePositions() {
    semka.el.style.left = semka.x + 'px';
    boss.el.style.left = boss.x + 'px';
  }

  function updateHealthBars() {
    document.getElementById('semka-health-fill').style.width = Math.max(0, (semka.hp / semka.maxHp) * 100) + '%';
    document.getElementById('boss-health-fill').style.width = Math.max(0, (boss.hp / boss.maxHp) * 100) + '%';
  }

  function showHitEffect(x, y, text) {
    const effect = document.createElement('div');
    effect.className = 'hit-effect';
    effect.textContent = text;
    effect.style.left = x + 'px';
    effect.style.bottom = y + 'px';
    document.getElementById('game-container').appendChild(effect);
    setTimeout(() => effect.remove(), 300);
  }

  function checkWinLose() {
    if (semka.hp <= 0) endGame(false);
    else if (boss.hp <= 0) endGame(true);
  }

  function endGame(isWin) {
    isGameRunning = false;
    cancelAnimationFrame(animationId);
    
    const overlay = document.getElementById('game-over');
    document.getElementById('result-text').textContent = isWin ? "FATALITY!" : "СЕМКА УНИЧТОЖЕН";
    document.getElementById('result-text').style.color = isWin ? "#00ff00" : "#ff0000";
    document.getElementById('result-sub').textContent = isWin ? "Семка победил! И даже не опоздал." : "Огурец победил. Семка снова опоздал на тренировку.";
    overlay.classList.remove('hidden');
  }
</script>
</body>
</html>
